services:
  # ───────────────────────────────────────────────────
  # 1. Auth & Profile Service
  # ───────────────────────────────────────────────────
  - type: web
    name: lifebalance-auth-service
    env: docker
    region: oregon
    plan: free
    rootDir: Auth_Profile
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: MongoDb__ConnectionString
        sync: false
      - key: MongoDb__DatabaseName
        value: LifeBalance_Auth
      - key: Jwt__SecretKey
        sync: false
      - key: Jwt__Issuer
        value: LifeBalance
      - key: Jwt__Audience
        value: LifeBalance
      - key: Jwt__AccessTokenExpirationMinutes
        value: "30"
      - key: Jwt__RefreshTokenExpirationDays
        value: "7"
      - key: Security__MaxFailedLoginAttempts
        value: "5"
      - key: Security__LockoutDurationMinutes
        value: "15"
      - key: Smtp__Host
        value: smtp.gmail.com
      - key: Smtp__Port
        value: "465"
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromEmail
        sync: false
      - key: Smtp__FromName
        value: LifeBalance
      - key: Smtp__UseSsl
        value: "true"
      - key: App__FrontendBaseUrl
        value: https://lifebalance-adv3.onrender.com
      - key: ServiceUrls__OrganizationUrl
        value: https://lifebalance-organization-saas.onrender.com

  # ───────────────────────────────────────────────────
  # 2. Dashboard Service
  # ───────────────────────────────────────────────────
  - type: web
    name: lifebalance-dashboard-service
    env: docker
    region: oregon
    plan: free
    rootDir: DashboardService
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: MongoDb__ConnectionString
        sync: false
      - key: MongoDb__DatabaseName
        value: LifeBalanceDashboard
      - key: Jwt__Issuer
        value: LifeBalance
      - key: Jwt__Audience
        value: LifeBalance
      - key: Jwt__SecretKey
        sync: false
      - key: ServiceUrls__AuthServiceUrl
        value: https://lifebalance-auth-service.onrender.com
      - key: ServiceUrls__MedicalDataServiceUrl
        value: https://medical-service-hb0v.onrender.com
      - key: ServiceUrls__SedentaryEngineServiceUrl
        value: https://sedentary-engine-service.onrender.com
      - key: ServiceUrls__GamificationServiceUrl
        value: https://gamification-service-9o3z.onrender.com
      - key: ServiceUrls__NotificationServiceUrl
        value: https://lifebalance-notifications-api.onrender.com
      - key: ServiceUrls__MlPredictionServiceUrl
        value: https://ml-prediction-service-0sqa.onrender.com
      - key: ServiceUrls__OrganizationServiceUrl
        value: https://lifebalance-organization-saas.onrender.com
      - key: ServiceUrls__ReportingServiceUrl
        value: https://lifebalance-reporting-service.onrender.com

  # ───────────────────────────────────────────────────
  # 3. Notifications & Alerts Service
  # ───────────────────────────────────────────────────
  - type: web
    name: lifebalance-notifications-api
    env: docker
    region: oregon
    plan: free
    rootDir: NotificationsAndAlerts
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: DatabaseName
        value: LifeBalanceNotificationsDb
      - key: ConnectionStrings__MongoDb
        sync: false
      - key: Jwt__SecretKey
        sync: false
      - key: Jwt__Issuer
        value: LifeBalance
      - key: Jwt__Audience
        value: LifeBalance
      - key: ExternalServices__AuthService
        value: https://lifebalance-auth-service.onrender.com
      - key: ExternalServices__OrganizationService
        value: https://lifebalance-organization-saas.onrender.com
      - key: ExternalServices__SedentaryService
        value: https://sedentary-engine-service.onrender.com
      - key: ExternalServices__MLService
        value: https://ml-prediction-service-0sqa.onrender.com
      - key: ExternalServices__AdminService
        value: https://lifebalance-administration-service.onrender.com
      - key: ExternalServices__DashboardService
        value: https://lifebalance-dashboard-service.onrender.com

  # ───────────────────────────────────────────────────
  # 4. Organization & SaaS Service
  # ───────────────────────────────────────────────────
  - type: web
    name: lifebalance-organization-saas
    env: docker
    region: oregon
    plan: free
    rootDir: OrganizationAndSaaS
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__MongoDB
        sync: false
      - key: DatabaseSettings__DatabaseName
        value: LifeBalance_OrganizationSaaS
      - key: JwtSettings__Secret
        sync: false
      - key: JwtSettings__Issuer
        value: LifeBalance
      - key: JwtSettings__Audience
        value: LifeBalance
      - key: Microservices__AuthProfileUrl
        value: https://lifebalance-auth-service.onrender.com
      - key: Microservices__DashboardUrl
        value: https://lifebalance-dashboard-service.onrender.com
      - key: Microservices__NotificationUrl
        value: https://lifebalance-notifications-api.onrender.com
      - key: Microservices__ReportingUrl
        value: https://reporting-service.invalid
      - key: Microservices__GamificationUrl
        value: https://gamification-service-9o3z.onrender.com
      - key: Microservices__MlPredictionUrl
        value: https://ml-prediction-service-0sqa.onrender.com
      - key: Microservices__AdministrationUrl
        value: https://lifebalance-administration-service.onrender.com

  # ───────────────────────────────────────────────────
  # 5. Administration & Configuration Service
  # ───────────────────────────────────────────────────
  - type: web
    name: lifebalance-administration-service
    env: docker
    region: oregon
    plan: free
    rootDir: AdministrationService
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__MongoDB
        sync: false
      - key: DatabaseSettings__DatabaseName
        value: LifeBalance_Administration
      - key: JwtSettings__Secret
        sync: false
      - key: JwtSettings__Issuer
        value: LifeBalance
      - key: JwtSettings__Audience
        value: LifeBalance
      - key: Microservices__AuthProfileUrl
        value: https://lifebalance-auth-service.onrender.com
      - key: Microservices__OrganizationUrl
        value: https://lifebalance-organization-saas.onrender.com
      - key: Microservices__DashboardUrl
        value: https://lifebalance-dashboard-service.onrender.com
      - key: Microservices__NotificationUrl
        value: https://lifebalance-notifications-api.onrender.com
      - key: Microservices__MedicalDataUrl
        value: https://medical-service-hb0v.onrender.com
      - key: Microservices__SedentaryEngineUrl
        value: https://sedentary-engine-service.onrender.com
      - key: Microservices__MlPredictionUrl
        value: https://ml-prediction-service-0sqa.onrender.com
      - key: Microservices__ReportingUrl
        value: https://lifebalance-reporting-service.onrender.com

  # ───────────────────────────────────────────────────
  # 6. Reporting Service
  # ───────────────────────────────────────────────────
  - type: web
    name: lifebalance-reporting-service
    env: docker
    region: oregon
    plan: free
    rootDir: ReportingService
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: MongoDb__ConnectionString
        sync: false
      - key: MongoDb__DatabaseName
        value: lifebalance_reporting
      - key: Jwt__Issuer
        value: LifeBalance
      - key: Jwt__Audience
        value: LifeBalance
      - key: Jwt__SecretKey
        sync: false
      - key: ServiceUrls__AuthServiceUrl
        value: https://lifebalance-auth-service.onrender.com
      - key: ServiceUrls__MedicalDataServiceUrl
        value: https://medical-service-hb0v.onrender.com
      - key: ServiceUrls__SedentaryEngineServiceUrl
        value: https://sedentary-engine-service.onrender.com
      - key: ServiceUrls__DashboardServiceUrl
        value: https://lifebalance-dashboard-service.onrender.com
      - key: ServiceUrls__OrganizationServiceUrl
        value: https://lifebalance-organization-saas.onrender.com
      - key: Cors__AllowedOrigins__0
        value: https://lifebalance-adv3.onrender.com
