services:
  - type: web
    name: lifebalance-dashboard-service
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/dashboard/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: MongoDb__ConnectionString
        sync: false
      - key: MongoDb__DatabaseName
        value: LifeBalanceDashboard
      - key: Jwt__Issuer
        value: LifeBalance.AuthService
      - key: Jwt__Audience
        value: LifeBalance.Services
      - key: Jwt__SecretKey
        sync: false
      - key: ServiceUrls__AuthServiceUrl
        value: http://auth-service.onrender.com
      - key: ServiceUrls__MedicalDataServiceUrl
        value: http://medical-service.onrender.com
      - key: ServiceUrls__SedentaryEngineServiceUrl
        value: http://sedentary-engine-service.onrender.com
      - key: ServiceUrls__GamificationServiceUrl
        value: http://gamification-service.onrender.com
      - key: ServiceUrls__NotificationServiceUrl
        value: http://notification-service.onrender.com
      - key: ServiceUrls__MlPredictionServiceUrl
        value: http://ml-prediction-service.onrender.com
      - key: ServiceUrls__OrganizationServiceUrl
        value: http://organization-service.onrender.com
      - key: ServiceUrls__ReportingServiceUrl
        value: http://reporting-service.onrender.com
