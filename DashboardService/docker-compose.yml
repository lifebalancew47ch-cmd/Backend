version: "3.9"

# ============================================================
# LifeBalance · Dashboard Service — Docker Compose
# ============================================================

networks:
  lifebalance-net:
    driver: bridge

volumes:
  mongo-data:

services:

  # ----------------------------------------------------------
  # MongoDB
  # ----------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: lifebalance-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: lifebalance_dashboard
    volumes:
      - mongo-data:/data/db
    networks:
      - lifebalance-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Dashboard API
  # ----------------------------------------------------------
  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: lifebalance-dashboard-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MongoDB: "mongodb://mongodb:27017"
      MongoDb__DatabaseName: lifebalance_dashboard
      Jwt__Issuer: "LifeBalance"
      Jwt__Audience: "LifeBalance"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_THIS_TO_A_32_CHARACTER_SECRET_KEY_IN_PRODUCTION!!}"
      Serilog__MinimumLevel__Default: "Information"
      OpenTelemetry__ServiceName: "dashboard-service"
      OpenTelemetry__Endpoint: "http://otel-collector:4317"
      CORS__AllowedOrigins: "http://localhost:3000"
    networks:
      - lifebalance-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ----------------------------------------------------------
  # Mongo Express (Dev UI) — basic auth enabled, loopback only
  # ----------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0
    container_name: lifebalance-mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongodb:27017/"
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    networks:
      - lifebalance-net
    profiles:
      - dev-tools
